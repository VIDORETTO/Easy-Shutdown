[package]
name = "wise-auto-shutdown"
version = "0.1.0"
description = "App moderno para gerenciar desligamento, bloqueio, reinicio e suspensão no Windows 11"
authors = ["Wise"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wise_auto_shutdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

# Win32 API bindings (apenas features necessárias)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Shutdown",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_Security",
] }

# Async runtime & utilities
tokio = { version = "1", features = ["time", "rt", "macros"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["clock"] }
rand = "0.9"

[features]
# Por padrão, usa custom protocol (produção)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
